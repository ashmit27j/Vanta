title: Bash History Cleared or Disabled
id: 549bb9c4-3f1c-4c3b-b712-1b51ae2e5fdc
status: experimental
description: |
    Detects commands that clear or disable Bash command history -- `history -c`,
    unsetting HISTFILE, or deleting ~/.bash_history directly. A common defense
    evasion step after running commands an attacker doesn't want logged.
references:
    - https://attack.mitre.org/techniques/T1070/003/
author: Vanta lab
date: 2026-09-12
tags:
    - attack.defense-evasion
    - attack.t1070.003
logsource:
    category: process_creation
    product: linux
detection:
    selection_history_clear:
        Image|endswith: '/bash'
        CommandLine|contains: 'history -c'
    selection_unset_histfile:
        CommandLine|contains:
            - 'unset HISTFILE'
            - 'export HISTFILE=/dev/null'
    selection_rm_history:
        Image|endswith:
            - '/rm'
            - '/shred'
        CommandLine|contains: '.bash_history'
    condition: 1 of selection_*
falsepositives:
    - Legitimate shell configuration changes
level: medium
