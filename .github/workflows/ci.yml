name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tooling
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install purplelab
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Validate Sigma rule syntax
        run: python -m purplelab.cli sigma convert

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck all provisioning scripts
        run: shellcheck provision/*/install.sh provision/*/*/install.sh provision/kali/verify-network.sh
