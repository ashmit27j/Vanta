[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "purplelab"
version = "0.0.1"
description = "Daily-loop CLI for Vanta: pick/run/check/log ATT&CK techniques, Sigma pipeline, coverage, safety-gated detonation."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# pySigma / sigma-cli land in Prompt 6 as an extra ("sigma") once the
# detection pipeline is built.

[project.scripts]
purplelab = "purplelab.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["purplelab*"]

[tool.setuptools.package-data]
purplelab = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
